openapi: 3.0.3
info:
  title: Viam Provisioner API
  version: 1.0.0
  description: |
    Control plane for a provisioning server. Clients queue machines (name plus
    optional per-machine Viam credentials), read queue state, and follow
    lifecycle events over Server-Sent Events.

    Queue entry status is derived from the server's on-disk state, never from
    the event stream, so operator actions performed outside the API
    (`just reset`, `just clean`, `just unguard`) are reflected on the next read
    but emit no events. Clients should refetch `/queue` on reconnect and when
    they receive a `resync` event.

    Snapshot-then-stream: take `last_event_id` from `GET /queue`, then open
    `GET /events` with that value as `Last-Event-ID`. Every event after the
    snapshot is delivered exactly once. Replayed events are idempotent.
servers:
  - url: /
tags:
  - name: queue
  - name: install
  - name: status
  - name: events

paths:
  /api/v1/provision:
    post:
      tags: [queue]
      operationId: provision
      summary: Add machines to the queue
      description: |
        All-or-nothing validation: if any item is invalid the whole request is
        rejected with 400 and nothing is written. Otherwise each item is either
        `added` or `skipped` (already queued, or a duplicate within this
        request). Credentials for an already-queued name are never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 500
              items:
                $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '200':
          description: Per-item results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Credentials could not be staged; nothing was queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/QueueUnreadable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/install-reports:
    post:
      tags: [install]
      operationId: reportInstall
      summary: Progress or failure report from a target's installer
      description: |
        Sent by the installer on the target machine, through the file server,
        which forwards only this path. Identify the machine by `mac` (PXE) or
        `name` (USB-flashed, or a PXE machine by name).

        `progress` records the stage the installer entered. Every report moves
        the machine's progress time, so an install that keeps reporting is never
        timed out. The final `done` stage only exempts the machine from the
        install timeout: it does not complete the install. A machine is
        `installed` when it PXE-boots again after installing.

        `failed` records the failure and removes the machine's GRUB guard, so
        its next PXE boot installs again. The installer's report replaces a
        failure that the timeout recorded. Repeating a failure, reporting one
        for a machine that has completed, or sending progress after the
        installer reported a failure changes nothing and is reported as
        `duplicate` or `ignored`. Progress after a timeout failure clears it.
        A USB-flashed machine has no PXE boot to restart it, so any progress
        report after its failure means the stick was booted again and clears
        the failure.

        The endpoint is unauthenticated, like the rest of this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallReport'
      responses:
        '200':
          description: Report processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/QueueUnreadable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/queue:
    get:
      tags: [queue]
      operationId: listQueue
      summary: Current queue state
      responses:
        '200':
          description: Queue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueList'
        '503':
          $ref: '#/components/responses/QueueUnreadable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/queue/{name}:
    parameters:
      - $ref: '#/components/parameters/Name'
    get:
      tags: [queue]
      operationId: getQueueEntry
      summary: Single machine status
      responses:
        '200':
          description: Queue entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/QueueUnreadable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [queue]
      operationId: removeQueueEntry
      summary: Remove an unassigned machine from the queue
      description: Removes the entry and any staged credentials. Fails with 409 once a machine has been assigned.
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The machine is already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/QueueUnreadable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/status:
    get:
      tags: [status]
      operationId: getStatus
      summary: Server health and service status
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /api/v1/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Machine lifecycle events (Server-Sent Events)
      description: |
        Each SSE frame carries `id:` (the event id), `event:` (the event type)
        and `data:` (a JSON object matching `MachineEvent`). The server sends
        `retry: 3000` on connect and a `: keepalive` comment every 15 seconds
        of silence.

        With `Last-Event-ID` the server replays every event with a greater id
        before switching to live delivery. Without it, only live events are
        sent. If the requested id is ahead of the server's journal or older than
        its retained history, the first frame is a `resync` event (no `id:`)
        and the client must refetch `/queue`.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
        - name: last_event_id
          in: query
          required: false
          description: Fallback for clients that cannot set the header. The header wins when both are present.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Too many open streams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
      x-sse-events:
        machine-assigned: '#/components/schemas/MachineAssigned'
        install-started: '#/components/schemas/InstallStarted'
        install-progress: '#/components/schemas/InstallProgress'
        install-failed: '#/components/schemas/InstallFailed'
        install-complete: '#/components/schemas/InstallComplete'
        guard-installed: '#/components/schemas/GuardInstalled'
        resync: '#/components/schemas/Resync'

components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such machine in the queue
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QueueUnreadable:
      description: queue.json exists but is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: Any other error (405 with Allow, 411, 413, 500, 503 queue-locked); the body is always an Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Name:
      type: string
      description: Machine name. RFC 1123 hostname label; also used as a directory name on the server.
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
      minLength: 1
      maxLength: 63

    Mac:
      type: string
      description: Lowercase colon-separated MAC address
      pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'

    ViamCredentials:
      type: object
      description: Contents of the machine's viam.json
      required: [cloud]
      additionalProperties: true
      properties:
        cloud:
          type: object
          required: [id, secret]
          additionalProperties: true
          properties:
            app_address:
              type: string
            id:
              type: string
              minLength: 1
            secret:
              type: string
              minLength: 1

    ProvisionRequest:
      type: object
      required: [name]
      additionalProperties: true
      properties:
        name:
          $ref: '#/components/schemas/Name'
        credentials:
          $ref: '#/components/schemas/ViamCredentials'

    ProvisionResult:
      type: object
      required: [name, result]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        result:
          type: string
          enum: [added, skipped]
        reason:
          type: string
          enum: [already-queued, duplicate-in-request]

    ProvisionResponse:
      type: object
      required: [results]
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProvisionResult'

    InstallStage:
      type: string
      description: |
        The section of the installer that was entered last.
        installer: before late-commands began (storage, packages). Only on failures.
        late-commands: late-commands started.
        identity: the machine is resolving its name and fetching its credentials.
        tooling: downloading the Viam CLI and agent.
        tailscale: installing Tailscale.
        done: late-commands finished. Exempts the machine from the install timeout; it does not complete the install.
        unknown: set by the server when the timeout fires on a machine that never reported a stage. Never accepted from a target.
      enum: [installer, late-commands, identity, tooling, tailscale, done, unknown]

    InstallReport:
      type: object
      description: Exactly one of name and mac identifies the machine. `reason` applies to `failed` only.
      required: [kind, stage]
      additionalProperties: true
      oneOf:
        - required: [name]
        - required: [mac]
      properties:
        kind:
          type: string
          enum: [progress, failed]
        stage:
          $ref: '#/components/schemas/InstallStage'
        name:
          $ref: '#/components/schemas/Name'
        mac:
          $ref: '#/components/schemas/Mac'
        reason:
          type: string
          description: Control characters become spaces, whitespace collapses, and the text is cut to 500 characters. An empty reason is replaced with a default.

    InstallReportResult:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          type: string
          enum: [recorded, duplicate, ignored]

    EntryStatus:
      type: string
      description: |
        queued: waiting for a machine.
        flashed: written to a USB stick; no PXE assignment will follow.
        assigned: a PXE client has been bound to this name and is installing or retrying.
        installing: the installer fetched its hostname; the GRUB guard is in place.
        installed: the machine PXE-booted again after install and was sent to disk.
        failed: the installer reported a failure, or the server saw no installer activity for the install timeout. A PXE machine installs again on its next boot, and a progress report after a timeout failure returns it to installing.
      enum: [queued, flashed, assigned, installing, installed, failed]

    QueueEntry:
      type: object
      required: [name, status, has_credentials]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        status:
          $ref: '#/components/schemas/EntryStatus'
        mac:
          $ref: '#/components/schemas/Mac'
        assigned_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        failed_at:
          $ref: '#/components/schemas/Timestamp'
        failure_reason:
          type: string
          maxLength: 500
        stage:
          $ref: '#/components/schemas/InstallStage'
        has_credentials:
          type: boolean
        flashed_via:
          type: string
          enum: [usb]

    QueueCounts:
      type: object
      required: [queued, flashed, assigned, installing, installed, failed, total]
      additionalProperties: false
      properties:
        queued: {type: integer, minimum: 0}
        flashed: {type: integer, minimum: 0}
        assigned: {type: integer, minimum: 0}
        installing: {type: integer, minimum: 0}
        installed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}

    QueueList:
      type: object
      required: [last_event_id, entries]
      additionalProperties: false
      properties:
        last_event_id:
          type: integer
          minimum: 0
          description: Newest event id at the time of the snapshot; pass as Last-Event-ID to /events.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntry'

    ServiceState:
      type: string
      enum: [up, down, unknown]

    ServerStatus:
      type: object
      required: [api_version, server_name, time, services, last_event_id]
      additionalProperties: false
      properties:
        api_version:
          type: string
          enum: [v1]
        server_name:
          type: string
        time:
          $ref: '#/components/schemas/Timestamp'
        address:
          type: string
          description: host:port of the HTTP file server targets fetch from, when the server can determine it
        queue:
          $ref: '#/components/schemas/QueueCounts'
        services:
          type: object
          required: [http, dnsmasq, watcher]
          additionalProperties: false
          properties:
            http:
              $ref: '#/components/schemas/ServiceState'
            dnsmasq:
              $ref: '#/components/schemas/ServiceState'
            watcher:
              $ref: '#/components/schemas/ServiceState'
        last_event_id:
          type: integer
          minimum: 0

    ErrorDetail:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        field:
          type: string
        message:
          type: string

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - invalid-request
                - invalid-json
                - invalid-name
                - not-found
                - already-assigned
                - method-not-allowed
                - length-required
                - payload-too-large
                - queue-unreadable
                - queue-locked
                - too-many-streams
                - stage-failed
                - internal
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    EventId:
      type: integer
      minimum: 1
      description: Journal id; also sent as the SSE `id:` field.

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 with second precision and a UTC offset, e.g. 2026-10-04T04:08:29+00:00

    MachineAssigned:
      type: object
      description: A PXE client was bound to a queued name.
      required: [id, type, timestamp, name, mac]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {type: string, enum: [machine-assigned]}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        name: {$ref: '#/components/schemas/Name'}
        mac: {$ref: '#/components/schemas/Mac'}

    InstallStarted:
      type: object
      description: The installer fetched its hostname; late-commands are running.
      required: [id, type, timestamp, name, mac, stage]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {type: string, enum: [install-started]}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        name: {$ref: '#/components/schemas/Name'}
        mac: {$ref: '#/components/schemas/Mac'}
        stage: {type: string, enum: [late-commands]}

    InstallProgress:
      type: object
      description: The installer entered a stage. For a machine whose timeout failure was just cleared, it means the install is still running.
      required: [id, type, timestamp, name, stage]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {type: string, enum: [install-progress]}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        name: {$ref: '#/components/schemas/Name'}
        mac:
          allOf:
            - $ref: '#/components/schemas/Mac'
          description: Absent for USB-flashed machines.
        stage: {$ref: '#/components/schemas/InstallStage'}

    InstallFailed:
      type: object
      description: |
        The installer reported a failure (`source: installer`), the server saw no
        activity for the install timeout (`timeout`), or the machine network-booted
        again before its installer reported anything (`reboot`; a new attempt
        starts at once, so a `machine-assigned` follows). An installer failure
        replaces an earlier timeout failure and is announced again.
      required: [id, type, timestamp, name, stage, reason, source]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {type: string, enum: [install-failed]}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        name: {$ref: '#/components/schemas/Name'}
        mac:
          allOf:
            - $ref: '#/components/schemas/Mac'
          description: Absent for USB-flashed machines.
        stage: {$ref: '#/components/schemas/InstallStage'}
        reason: {type: string, maxLength: 500}
        source: {type: string, enum: [installer, timeout, reboot]}

    InstallComplete:
      type: object
      description: The machine PXE-booted again after install and was sent to its disk. The installer's final `done` report does not produce this event.
      required: [id, type, timestamp, name, mac, duration_seconds]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {type: string, enum: [install-complete]}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        name: {$ref: '#/components/schemas/Name'}
        mac: {$ref: '#/components/schemas/Mac'}
        duration_seconds:
          type: number
          minimum: 0
          description: Seconds from assignment to this event

    GuardInstalled:
      type: object
      description: The GRUB guard for this MAC was written.
      required: [id, type, timestamp, name, mac, reason]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {type: string, enum: [guard-installed]}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        name: {$ref: '#/components/schemas/Name'}
        mac: {$ref: '#/components/schemas/Mac'}
        reason: {type: string, enum: [hostname-fetch, repeat-pxe]}

    Resync:
      type: object
      description: The client's Last-Event-ID cannot be served; refetch /queue and continue from latest_id. Sent without an SSE `id:`.
      required: [type, latest_id]
      additionalProperties: false
      properties:
        type: {type: string, enum: [resync]}
        latest_id:
          type: integer
          minimum: 0

    MachineEvent:
      description: The `data` object of every SSE frame.
      oneOf:
        - $ref: '#/components/schemas/MachineAssigned'
        - $ref: '#/components/schemas/InstallStarted'
        - $ref: '#/components/schemas/InstallProgress'
        - $ref: '#/components/schemas/InstallFailed'
        - $ref: '#/components/schemas/InstallComplete'
        - $ref: '#/components/schemas/GuardInstalled'
        - $ref: '#/components/schemas/Resync'
      discriminator:
        propertyName: type
        mapping:
          machine-assigned: '#/components/schemas/MachineAssigned'
          install-started: '#/components/schemas/InstallStarted'
          install-progress: '#/components/schemas/InstallProgress'
          install-failed: '#/components/schemas/InstallFailed'
          install-complete: '#/components/schemas/InstallComplete'
          guard-installed: '#/components/schemas/GuardInstalled'
          resync: '#/components/schemas/Resync'
