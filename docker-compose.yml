services:
  http-server:
    build: ./http-server
    container_name: pxe-http
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8234}:8080"
    environment:
      - TZ=${TZ:-America/New_York}
      # nginx forwards installer reports to the provisioner API on the host.
      - API_PORT=${API_PORT:-8235}
      - NGINX_ENVSUBST_FILTER=API_PORT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./http-server/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./http-server/ubuntu:/srv/ubuntu:ro
      - ./http-server/autoinstall:/srv/autoinstall:ro
      - ./http-server/machines:/srv/machines:ro
      - ./http-server/scripts:/srv/scripts:ro
      - ./http-server/config:/srv/config:ro
      - ./logs:/var/log/pxe
